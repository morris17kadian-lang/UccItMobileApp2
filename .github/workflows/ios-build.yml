name: Build iOS App for Appetize
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # This creates the debug framework for the iOS Simulator
      - name: Build iOS Simulator Framework
        run: ./gradlew :app:iosSimulatorArm64Binaries

      - name: Package for Appetize
        run: |
          # Create a clean workspace for the zip
          mkdir -p build/appetize
          
          # Copy the compiled framework into the workspace
          # Note: KMP generates a .framework which acts like a .app for the simulator
          cp -r app/build/bin/iosSimulatorArm64/debugFramework/ComposeApp.framework build/appetize/
          
          # Move into the folder so the zip doesn't have extra "wrapper" folders
          cd build/appetize
          zip -r ../../ios-simulator-app.zip .

      - name: Upload to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-for-appetize
          path: ios-simulator-app.zip