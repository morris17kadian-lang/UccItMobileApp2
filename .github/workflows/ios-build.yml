name: Build iOS for Appetize
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 1. Build the actual Kotlin code
      - name: Build Kotlin Framework
        run: ./gradlew :app:iosSimulatorArm64Binaries

      # 2. Manually assemble the .app folder Appetize needs
      - name: Create App Bundle
        run: |
          mkdir -p build/Appetize/ComposeApp.app
          
          # Copy the framework into the app folder
          cp -r app/build/bin/iosSimulatorArm64/debugFramework/ComposeApp.framework build/Appetize/ComposeApp.app/
          
          # Create a basic Info.plist so iOS knows how to launch it
          cat <<EOF > build/Appetize/ComposeApp.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>ComposeApp</string>
              <key>CFBundleIdentifier</key>
              <string>com.ucc.itmobileapp</string>
              <key>CFBundleName</key>
              <string>UCC IT App</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
          </dict>
          </plist>
          EOF

      # 3. Zip it correctly
      - name: Package for Appetize
        run: |
          cd build/Appetize
          zip -r ../../ios-simulator-app.zip .

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-for-appetize
          path: ios-simulator-app.zip